name: CI-CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run CI check script
        run: python ci_check.py

      - name: Run tests
        run: PYTHONPATH=. python -m pytest -v

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/internal-utility-app:latest .

      - name: Tag versioned image
        run: docker tag ${{ secrets.DOCKER_USERNAME }}/internal-utility-app:latest ${{ secrets.DOCKER_USERNAME }}/internal-utility-app:v1.0.0

      - name: Push latest image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/internal-utility-app:latest

      - name: Push versioned image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/internal-utility-app:v1.0.0

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/internal-utility-app:latest
            docker stop app || true
            docker rm app || true
            docker run -d -p 80:5000 --name app ${{ secrets.DOCKER_USERNAME }}/internal-utility-app:latest
